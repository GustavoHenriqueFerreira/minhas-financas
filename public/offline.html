<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#25243c" />
    <title>Minhas Finanças — sem conexão</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f6f5f9; color: #242338; font: 16px/1.6 system-ui, sans-serif; }
      main { width: min(100%, 430px); padding: 32px; background: #fff; border: 1px solid #e7e5ef; border-radius: 18px; text-align: center; box-shadow: 0 10px 35px #2e275609; }
      span { display: grid; place-items: center; width: 48px; height: 48px; margin: 0 auto 18px; border-radius: 14px; background: #6254c7; color: #fff; font-size: 24px; }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { margin: 0 0 22px; color: #60647c; }
      button { min-height: 44px; padding: 0 18px; border: 0; border-radius: 9px; background: #6254c7; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <span aria-hidden="true">↻</span>
      <h1>Você está sem conexão</h1>
      <p>Seus dados continuam protegidos. Conecte-se à internet para carregar ou registrar movimentações.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
